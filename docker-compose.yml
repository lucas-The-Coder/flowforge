services:
  postgres:
    image: postgres:17
    container_name: flowforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - flowforge_postgres_data:/var/lib/postgresql/data

volumes:
  flowforge_postgres_data:
