{% extends "base.html" %}

{% block title %}
New Task | FlowForge
{% endblock %}

{% block header %}
New Task
{% endblock %}

{% block header_subtitle %}
Create a task
{% endblock %}

{% block content %}

<div class="max-w-3xl">

    <div class="mb-6">

        <a href="/tasks" class="text-sm text-violet-400 hover:text-violet-300 transition">
            ← Back to tasks
        </a>

    </div>


    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8">

        <div class="mb-8">

            <h1 class="text-2xl font-bold">
                Create task
            </h1>

            <p class="text-slate-500 mt-2">
                Add work for your team or business.
            </p>

        </div>


        <form method="post" action="/tasks" class="space-y-6">

            <div>

                <label for="title" class="block text-sm font-medium mb-2">
                    Task title
                </label>

                <input id="title" name="title" type="text" required maxlength="255" placeholder="Follow up with client"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 outline-none focus:border-violet-500">

            </div>


            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div>

                    <label for="priority" class="block text-sm font-medium mb-2">
                        Priority
                    </label>

                    <select id="priority" name="priority"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 outline-none focus:border-violet-500">

                        {% for priority_value, priority_label in priorities.items() %}

                        <option value="{{ priority_value }}" {% if priority_value==2 %}selected{% endif %}>
                            {{ priority_label }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div>

                    <label for="due_date" class="block text-sm font-medium mb-2">
                        Due date
                    </label>

                    <input id="due_date" name="due_date" type="date"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 outline-none focus:border-violet-500">

                </div>

            </div>


            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div>

                    <label for="company_id" class="block text-sm font-medium mb-2">
                        Company
                    </label>

                    <select id="company_id" name="company_id"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 outline-none focus:border-violet-500">

                        <option value="">
                            No company
                        </option>

                        {% for company in companies %}

                        <option value="{{ company.id }}">
                            {{ company.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div>

                    <label for="contact_id" class="block text-sm font-medium mb-2">
                        Contact
                    </label>

                    <select id="contact_id" name="contact_id"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 outline-none focus:border-violet-500">

                        <option value="">
                            No contact
                        </option>

                        {% for contact in contacts %}

                        <option value="{{ contact.id }}">
                            {{ contact.first_name }} {{ contact.last_name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>


            <div>

                <label for="description" class="block text-sm font-medium mb-2">
                    Description
                </label>

                <textarea id="description" name="description" rows="6" placeholder="Describe what needs to be done..."
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 outline-none focus:border-violet-500 resize-none"></textarea>

            </div>


            <div class="flex flex-col sm:flex-row gap-3 pt-2">

                <button type="submit"
                    class="px-6 py-3.5 rounded-xl bg-violet-600 hover:bg-violet-500 font-semibold transition">
                    Create task
                </button>

                <a href="/tasks"
                    class="px-6 py-3.5 rounded-xl border border-slate-700 hover:bg-slate-800 text-center transition">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
