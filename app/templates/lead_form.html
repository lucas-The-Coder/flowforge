{% extends "base.html" %}

{% block title %}
New Lead | FlowForge
{% endblock %}

{% block header %}
New Lead
{% endblock %}

{% block header_subtitle %}
Add an opportunity to your sales pipeline
{% endblock %}

{% block content %}

<div class="max-w-3xl">

    <div class="mb-6">

        <a
            href="/leads"
            class="text-sm text-violet-400 hover:text-violet-300 transition"
        >
            ← Back to pipeline
        </a>

    </div>


    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8">

        <form
            method="post"
            action="/leads"
            class="space-y-6"
        >

            <!-- Title -->
            <div>

                <label
                    for="title"
                    class="block text-sm font-medium mb-2"
                >
                    Lead title
                </label>

                <input
                    id="title"
                    name="title"
                    type="text"
                    required
                    maxlength="255"
                    placeholder="Website automation project"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 outline-none focus:border-violet-500"
                >

            </div>


            <!-- Status -->
            <div>

                <label
                    for="status_name"
                    class="block text-sm font-medium mb-2"
                >
                    Pipeline stage
                </label>

                <select
                    id="status_name"
                    name="status_name"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 outline-none focus:border-violet-500"
                >

                    {% for status_name in status_options %}

                    <option
                        value="{{ status_name }}"
                        {% if status_name == "new" %}selected{% endif %}
                    >
                        {{ status_labels[status_name] }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- Company and Contact -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div>

                    <label
                        for="company_id"
                        class="block text-sm font-medium mb-2"
                    >
                        Company
                    </label>

                    <select
                        id="company_id"
                        name="company_id"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 outline-none focus:border-violet-500"
                    >

                        <option value="">
                            No company
                        </option>

                        {% for company in companies %}

                        <option value="{{ company.id }}">
                            {{ company.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div>

                    <label
                        for="contact_id"
                        class="block text-sm font-medium mb-2"
                    >
                        Contact
                    </label>

                    <select
                        id="contact_id"
                        name="contact_id"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 outline-none focus:border-violet-500"
                    >

                        <option value="">
                            No contact
                        </option>

                        {% for contact in contacts %}

                        <option value="{{ contact.id }}">
                            {{ contact.first_name }} {{ contact.last_name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>


            <!-- Value -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div>

                    <label
                        for="value"
                        class="block text-sm font-medium mb-2"
                    >
                        Estimated value
                    </label>

                    <div class="relative">

                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-600">
                            R
                        </span>

                        <input
                            id="value"
                            name="value"
                            type="number"
                            step="0.01"
                            min="0"
                            placeholder="25000"
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-10 pr-4 py-3.5 outline-none focus:border-violet-500"
                        >

                    </div>

                </div>


                <div>

                    <label
                        for="probability"
                        class="block text-sm font-medium mb-2"
                    >
                        Probability
                    </label>

                    <div class="relative">

                        <input
                            id="probability"
                            name="probability"
                            type="number"
                            min="0"
                            max="100"
                            placeholder="10"
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 pr-10 outline-none focus:border-violet-500"
                        >

                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-600">
                            %
                        </span>

                    </div>

                </div>

            </div>


            <!-- Close date -->
            <div>

                <label
                    for="expected_close_date"
                    class="block text-sm font-medium mb-2"
                >
                    Expected close date
                </label>

                <input
                    id="expected_close_date"
                    name="expected_close_date"
                    type="date"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 outline-none focus:border-violet-500"
                >

            </div>


            <!-- Notes -->
            <div>

                <label
                    for="notes"
                    class="block text-sm font-medium mb-2"
                >
                    Notes
                </label>

                <textarea
                    id="notes"
                    name="notes"
                    rows="6"
                    placeholder="Describe the opportunity..."
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 outline-none focus:border-violet-500 resize-none"
                ></textarea>

            </div>


            <!-- Buttons -->
            <div class="flex flex-col sm:flex-row gap-3">

                <button
                    type="submit"
                    class="px-6 py-3.5 rounded-xl bg-violet-600 hover:bg-violet-500 font-semibold transition"
                >
                    Create lead
                </button>

                <a
                    href="/leads"
                    class="px-6 py-3.5 rounded-xl border border-slate-700 hover:bg-slate-800 text-center transition"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
